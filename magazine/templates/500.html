{% extends "magazine/base.html" %}

{% block title %}Server Error — ISFDB Explorer{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-1 text-muted fw-light">500</h1>
  <h2 class="h4 mb-3">Something went wrong</h2>
  <p class="text-muted mb-4">
    An unexpected error occurred. Please try again, or go back to the home page.
  </p>
  <div class="d-flex gap-2 justify-content-center">
    <a href="javascript:history.back()" class="btn btn-outline-secondary">&larr; Go back</a>
    <a href="{% url 'home' %}" class="btn btn-primary">Home</a>
  </div>
</div>
{% endblock %}
