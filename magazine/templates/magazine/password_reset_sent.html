{% extends "magazine/base.html" %}
{% block title %}Reset Link Sent — ISFDB Explorer{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-5">

    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <i class="bi bi-envelope-check fs-1 text-success mb-3 d-block"></i>
        <h1 class="h4 mb-3">Check your email</h1>
        <p class="text-muted">If that email address is registered, we've sent a password reset link. The link expires in 1 hour.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-secondary mt-2">Back to sign in</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
