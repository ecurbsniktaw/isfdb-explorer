{% extends "magazine/base.html" %}
{% block title %}Password Reset — ISFDB Explorer{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-5">

    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <i class="bi bi-check-circle fs-1 text-success mb-3 d-block"></i>
        <h1 class="h4 mb-3">Password updated</h1>
        <p class="text-muted">Your password has been changed and you are now signed in.</p>
        <a href="{% url 'my_collection' %}" class="btn btn-primary">Go to My Collection</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
